# AMP comparison run.
#
# Identical to configs/experiments/gpt_tinystories.yaml (the local reference
# `tinystories/gpt`, val loss 1.694) EXCEPT that mixed precision is on. Run it on
# a CUDA GPU (Colab) and compare:
#   - validation loss  -> should be ~the same as the reference (AMP is numerical,
#     not a modelling change)
#   - throughput/tokens_per_sec -> should be much higher
#
# amp_dtype: auto picks bf16 on Ampere+ and fp16 on Turing (e.g. the free T4,
# which has fp16 but not bf16 tensor cores).
experiment: amp
run_name: gpt_tinystories
seed: 0
device: auto

data:
  corpus: tinystories
  raw_dir: data/raw
  processed_dir: data/processed/tinystories
  val_fraction: 0.01
  context_window: 128
  max_documents: 100000
  tokenizer:
    vocab_size: 4096
    output: artifacts/tokenizer/tinystories_bpe.json

model:
  type: gpt
  n_layer: 3
  n_head: 6
  n_embd: 192
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 64
  learning_rate: 3.0e-3
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 200
  max_steps: 20000
  eval_interval: 500
  eval_batches: 20
  log_interval: 50
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  amp: true
  amp_dtype: auto

sampling:
  prompt: "Once upon a time"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
