# Chinchilla experiment, scaled up: the ~355M model, trained compute-optimally,
# with the GPT-2-style 1024-token context window.
#
#   N      = 354,801,024 params  (21L / 1152d / 18H, vocab 16384, tied, ctx 1024)
#   k      = 20 tokens/param     (Chinchilla)
#   D_seen = k * N               = 7,096,020,480 tokens
#   tokens/step = batch * context = 16 * 1024 = 16,384
#   steps       = D / tokens/step = 7,096,020,480 / 16,384 = 433,106
#   warmup      = 16,384,000 / 16,384 = 1,000   (same warmup *in tokens* as xl3)
#   corpus >= D_seen             (prepare ~8B unique tokens, ~1 epoch)
#
# Context is 1024 — the context experiment (context/xl3_ctx1024) showed a ~6%
# bits/byte gain over 128 at equal budget.
#
# Batch is 16: at ctx 1024 the O(L) activations plus the LM-head logits for a
# 355M model overflow a 40 GB A100 at batch 32 (observed CUDA OOM), so we halved
# it. Halving the batch doubles the steps but leaves tokens seen unchanged.
#
# The tokenizer is *reused* from the 97.7M Chinchilla run (same corpus, same
# vocab) so the runs stay comparable. Token ids are stored int16.
experiment: chinchilla
run_name: xl4
seed: 0
device: auto

data:
  corpus: fineweb_edu
  raw_dir: data/raw
  processed_dir: data/processed/fineweb_edu_chinchilla_xl4
  val_fraction: 0.01
  context_window: 1024
  max_documents: 7500000
  max_train_tokens: 7096020480
  tokenizer:
    vocab_size: 16384
    output: artifacts/tokenizer/fineweb_edu_chinchilla_bpe.json
    reuse: true

model:
  type: gpt
  n_layer: 21
  n_head: 18
  n_embd: 1152
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 1000
  max_steps: 433106
  eval_interval: 1000
  eval_batches: 20
  log_interval: 50
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  amp: true
  amp_dtype: auto

sampling:
  prompt: "The history of"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
