# Chinchilla experiment, scaled up: the ~354M model, trained compute-optimally.
#
#   N      = 353,768,832 params  (21L / 1152d / 18H, vocab 16384, tied)
#   k      = 20 tokens/param     (Chinchilla)
#   D_seen = k * N               = 7,075,376,640 tokens
#   steps  = D_seen / (batch*context) = 7,075,376,640 / 8192 = 863,693
#   corpus >= D_seen             (prepare ~8B unique tokens, ~1 epoch)
#
# The tokenizer is *reused* from the 97.7M Chinchilla run (same corpus, same
# vocab) so the two runs stay directly comparable. Token ids are stored int16.
experiment: chinchilla
run_name: xl4
seed: 0
device: auto

data:
  corpus: fineweb_edu
  raw_dir: data/raw
  processed_dir: data/processed/fineweb_edu_chinchilla_xl4
  val_fraction: 0.01
  context_window: 128
  max_documents: 7500000
  max_train_tokens: 7075376640
  tokenizer:
    vocab_size: 16384
    output: artifacts/tokenizer/fineweb_edu_chinchilla_bpe.json
    reuse: true

model:
  type: gpt
  n_layer: 21
  n_head: 18
  n_embd: 1152
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 2000
  max_steps: 863693
  eval_interval: 2000
  eval_batches: 20
  log_interval: 100
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  amp: true
  amp_dtype: auto

sampling:
  prompt: "The history of"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
