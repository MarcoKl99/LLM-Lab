# Chinchilla experiment: our largest model, trained compute-optimally.
#
#   N      = 97,737,216 params  (xl3 @ 16k vocab)
#   k      = 20 tokens/param    (Chinchilla)
#   D_seen = k * N              = 1,954,744,320 tokens
#   steps  = D_seen / (batch*context) = 1,954,744,320 / 8192 = 238,616
#   corpus >= D_seen            (prepare ~2B unique tokens, ~1 epoch)
#
# The tokenizer is (re)trained at vocab 16384 on this larger corpus.
# Token ids are stored as int16 (4 GB for 2B tokens).
experiment: chinchilla
run_name: xl3
seed: 0
device: auto

data:
  corpus: fineweb_edu
  raw_dir: data/raw
  processed_dir: data/processed/fineweb_edu_chinchilla
  val_fraction: 0.01
  context_window: 128
  max_documents: 3000000
  max_train_tokens: 1954744320
  tokenizer:
    vocab_size: 16384
    output: artifacts/tokenizer/fineweb_edu_chinchilla_bpe.json

model:
  type: gpt
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 64
  learning_rate: 6.0e-4
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 2000
  max_steps: 238616
  eval_interval: 2000
  eval_batches: 20
  log_interval: 100
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  amp: true
  amp_dtype: auto

sampling:
  prompt: "The history of"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
