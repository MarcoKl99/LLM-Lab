# Context-length experiment: does a GPT-2-style 1024-token window help, at the
# same compute-optimal (Chinchilla) budget?
#
# One change only — the context window — against the **Chinchilla `xl3` run**:
# same model (xl3), corpus (FineWeb-Edu) and tokenizer (vocab 16384). The data
# budget is re-derived so both runs stay compute-optimal at k = 20 tokens/param
# (the bigger position table makes N — and therefore D — slightly larger: +0.70%).
#
#   N      = 98,425,344 params  (xl3 + a 1024-row position table: +688,128 vs ctx 128)
#   D_seen = k * N              = 20 * 98,425,344 = 1,968,506,880 tokens
#   tokens/step = batch * context = 32 * 1024 = 32,768
#   steps       = D / tokens/step = 1,968,506,880 / 32,768 = 60,074
#   warmup      = 2000 * (8192 / 32,768) = 500   (identical warmup *in tokens*)
#   eval        = 2000 * (8192 / 32,768) = 500
#
# NOTE: batch is 32 (not the baseline's 64) to fit a 40 GB A100 — the O(L^2)
# attention matrix at context 1024 is ~19 GB at batch 64. D and the LR schedule
# are identical in *tokens*; the only difference vs the baseline is the (slightly
# noisier) batch. Gradient checkpointing would restore batch 64 if we want it.
#
# LR is the baseline's 6e-4. Earlier ctx-1024 runs at 6e-4 / 3e-4 / 1e-4 all
# showed the same failure — train loss collapsing while val loss rose — but that
# was NOT an LR problem: the old ShuffledChunkSampler read a single 1M-token chunk
# for the first ~32k steps, so the model only ever saw ~1M unique positions and
# memorised them. The sampler is now ChunkedRandomSampler (globally mixed every
# step), so the LR is restored to the baseline value.
#
# Compare *bits-per-byte* against chinchilla/xl3 (xl3 @ context 128).
# Reuses the already-prepared chinchilla token tensors — no prepare needed.
experiment: context
run_name: xl3_ctx1024
seed: 0
device: auto

data:
  corpus: fineweb_edu
  raw_dir: data/raw
  processed_dir: data/processed/fineweb_edu_chinchilla
  val_fraction: 0.01
  context_window: 1024
  max_documents: 3000000
  max_train_tokens: 1968506880
  tokenizer:
    vocab_size: 16384
    output: artifacts/tokenizer/fineweb_edu_chinchilla_bpe.json
    reuse: true

model:
  type: gpt
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 32
  learning_rate: 6.0e-4
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 500
  max_steps: 60074
  eval_interval: 500
  eval_batches: 20
  log_interval: 25
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  amp: true
  amp_dtype: auto

sampling:
  prompt: "The history of"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
