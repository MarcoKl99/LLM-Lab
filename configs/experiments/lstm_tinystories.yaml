experiment: tinystories
run_name: lstm
seed: 0
device: auto

data:
  corpus: tinystories
  raw_dir: data/raw
  processed_dir: data/processed/tinystories
  val_fraction: 0.01
  context_window: 128
  max_documents: 100000
  tokenizer:
    vocab_size: 4096
    output: artifacts/tokenizer/tinystories_bpe.json

model:
  type: lstm
  hidden_size: 192
  num_layers: 2
  dropout: 0.0

training:
  batch_size: 64
  learning_rate: 3.0e-3
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 200
  max_steps: 20000
  eval_interval: 500
  eval_batches: 20
  log_interval: 50
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
  early_stopping:
    patience: 5
    min_delta: 0.0

sampling:
  prompt: "Once upon a time"
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
