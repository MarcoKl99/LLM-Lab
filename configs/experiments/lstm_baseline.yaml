run_name: lstm_baseline
seed: 0
device: auto

data:
  corpus: tiny_shakespeare
  raw_dir: data/raw
  processed_dir: data/processed/tiny_shakespeare
  val_fraction: 0.1
  context_window: 64
  tokenizer:
    vocab_size: 1024
    output: artifacts/tokenizer/tiny_shakespeare_bpe.json

model:
  type: lstm
  hidden_size: 256
  num_layers: 2
  dropout: 0.0

training:
  batch_size: 32
  learning_rate: 3.0e-3
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 100
  max_steps: 2000
  eval_interval: 200
  eval_batches: 20
  log_interval: 50
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true

sampling:
  prompt: "ROMEO: "
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
