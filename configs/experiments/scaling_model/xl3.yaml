# Model-size scaling at a fixed, adequate data budget (D = 164M tokens) and a
# fixed step budget (20k). Aspect ratio n_embd/n_layer = 64, head_dim = 64.
# LR scaled down with width: lr ~ 1/n_embd (xl@512d = 1e-3 -> xl3@768d = 6e-4).
experiment: scaling_model
run_name: xl3
seed: 0
device: auto

data:
  corpus: tinystories
  raw_dir: data/raw
  processed_dir: data/processed/tinystories_pool
  val_fraction: 0.01
  context_window: 128
  max_documents: 800000
  max_train_tokens: 164000000
  tokenizer:
    vocab_size: 4096
    output: artifacts/tokenizer/tinystories_pool_bpe.json

model:
  type: gpt
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  tie_weights: true

training:
  batch_size: 64
  learning_rate: 6.0e-4
  weight_decay: 0.0
  min_lr_ratio: 0.1
  warmup_steps: 200
  max_steps: 20000
  eval_interval: 500
  eval_batches: 20
  log_interval: 50
  grad_clip: 1.0
  checkpoint_dir: artifacts/runs
  resume: true
