[project]
name = "llm-lab"
version = "0.0.1"
description = "Building a decoder-only language model from scratch, one experiment at a time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "tensorboard",
    "datasets",
    "tokenizers",
    "pyyaml",
    "tqdm>=4.70.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
